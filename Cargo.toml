[package]
name = "sonoba"
version = "0.1.6"
edition = "2024"

[dependencies]
rayon = "1.12.0"
rten = "0.27"
rten-tensor = "0.27"
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false }
webview2-com = "0.39"
windows = { version = "0.62", default-features = false, features = ["std", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps","Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Com", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[dev-dependencies]
png = "0.18"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

# The test reads real images; unoptimised tensor code would take minutes.
[profile.test]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
