<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Sonoba</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f4f3; --side: #e9ebe9; --card: #ffffff; --line: #dfe2df; --text: #1c211e; --soft: #5f6862;
  --accent: #1f9d57; --accent-text: #ffffff; --accent-soft: #e0f3e8; --danger: #c43b3b; --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1e1c; --side: #151816; --card: #252927; --line: #363b38; --text: #eef1ef; --soft: #a2aba6;
    --accent: #37c37a; --accent-text: #0d1a12; --accent-soft: #1f3a2b; --danger: #ef7a7a; --field: #1e2220;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Malgun Gothic", sans-serif;
  color: var(--text); background: var(--bg); display: flex; overflow: hidden; user-select: none;
}
nav { width: 188px; flex: none; background: var(--side); padding: 20px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .brand { font-weight: 650; font-size: 15px; padding: 0 12px 16px; display: flex; align-items: center; gap: 9px; }
nav .brand i { width: 12px; height: 12px; border: 2.5px solid var(--accent); border-radius: 3px; display: block; }
nav button {
  all: unset; padding: 8px 12px; border-radius: 7px; cursor: pointer; color: var(--soft); position: relative;
}
nav button:hover { background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
nav button[aria-current=true] { background: var(--card); color: var(--text); font-weight: 600; }
nav button[aria-current=true]::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent);
}
nav button:focus-visible { outline: 2px solid var(--accent); }
main { flex: 1; overflow-y: auto; padding: 26px 30px 30px; }
section { display: none; max-width: 640px; }
section.on { display: block; }
h1 { font-size: 20px; font-weight: 650; margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 16px; min-height: 52px; }
.row + .row { border-top: 1px solid var(--line); }
.row > div:first-child { min-width: 0; }
.row b { font-weight: 550; display: block; }
.row small, .hint { color: var(--soft); font-size: 12.5px; display: block; }
.row > a { white-space: nowrap; }
.hint { margin: -4px 2px 14px; line-height: 1.6; }
select, .key {
  font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 10px; min-width: 210px; max-width: 320px;
}
select { cursor: pointer; }
.key { cursor: pointer; text-align: center; font-variant-numeric: tabular-nums; }
.key.wait { border-color: var(--accent); color: var(--accent); }
.key.off { color: var(--soft); }
.keyset { display: flex; align-items: center; gap: 6px; flex: none; }
.keyset .key { min-width: 170px; }
.mini { all: unset; cursor: pointer; color: var(--soft); font-size: 12.5px; padding: 3px 6px; border-radius: 6px; white-space: nowrap; }
.mini:hover:not(:disabled) { color: var(--accent); }
.mini:disabled { opacity: .4; cursor: default; }
.mini:focus-visible { outline: 2px solid var(--accent); }
.key.taken { border-color: var(--danger); color: var(--danger); }
select:focus-visible, .key:focus-visible, .btn:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn {
  white-space: nowrap; font: inherit; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 7px;
  padding: 6px 14px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 16px 14px; }
.status { padding: 0 16px 10px; color: var(--soft); font-size: 13px; }
.bar { height: 5px; background: var(--line); border-radius: 3px; margin: 0 16px 10px; overflow: hidden; display: none; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 11px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after {
  content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px #0005; transition: left .15s;
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { left: 21px; }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.message { color: var(--danger); margin: 0 2px 12px; min-height: 0; }
a { color: var(--accent); cursor: pointer; text-decoration: underline; }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px 22px; max-width: 440px;
}
dialog::backdrop { background: #0006; }
dialog h2 { margin: 0 0 8px; font-size: 16px; }
dialog p { margin: 0 0 10px; }
dialog .actions { padding: 8px 0 0; justify-content: flex-end; }
#intro {
  position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 5;
}
#intro.on { display: flex; }
#intro .panel { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; }
#intro h1 { font-size: 24px; margin-bottom: 6px; }
#intro p { color: var(--soft); margin: 0 0 16px; }
.step { display: none; }
.step.on { display: block; }
.choice {
  all: unset; display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--card); margin-bottom: 8px; cursor: pointer; width: 100%; box-sizing: border-box;
}
.choice[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
.choice small { color: var(--soft); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.seg button { all: unset; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); }
#intro .seg { justify-content: flex-start; margin: 2px 0 0; }
.steps { color: var(--soft); font-size: 12.5px; margin-bottom: 18px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin-bottom: 14px; }
.terms { padding: 4px 16px 12px; }
.term { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
input[type=text], input[type=search] {
  font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; width: 100%; min-width: 0;
}
input[type=text]:focus-visible, input[type=search]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.x { all: unset; cursor: pointer; color: var(--soft); padding: 2px 8px; border-radius: 6px; }
.x:hover { color: var(--danger); }
.past { padding: 10px 16px; cursor: pointer; user-select: text; }
.past + .past { border-top: 1px solid var(--line); }
.past:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.past small { color: var(--soft); display: block; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.points { margin: 0 0 12px; padding-left: 20px; color: var(--text); }
.points li { margin-bottom: 5px; }
.agree { display: flex; gap: 9px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); cursor: pointer; }
.agree input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
#lic_agree_row { margin: 0 16px 12px; }
#script_list .row, #script_add { border-top: 1px solid var(--line); }
#script_add b { flex: none; }
#script_add { flex-wrap: wrap; row-gap: 8px; } /* a long language name moves the list to its own line, not cut off */
#script_add .pick { margin-left: auto; }
#script_add select { max-width: none; }
.pick { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pick select { min-width: 0; }
[hidden] { display: none !important; }
kbd { font: inherit; font-size: 12.5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); white-space: nowrap; }
</style>
</head>
<body>
<nav>
  <div class="brand"><i></i>Sonoba</div>
  <button data-go="translate" data-t="nav_translate"></button>
  <button data-go="model" data-t="nav_model"></button>
  <button data-go="keys" data-t="nav_keys"></button>
  <button data-go="look" data-t="nav_look"></button>
  <button data-go="history" data-t="nav_history"></button>
  <button data-go="run" data-t="nav_run"></button>
  <button data-go="about" data-t="nav_about"></button>
</nav>
<main>
  <p class="message" id="message" hidden></p>

  <section id="translate">
    <h1 data-t="nav_translate"></h1>
    <div class="card">
      <div class="row"><div><b data-t="source"></b><small data-t="source_note"></small></div><select id="source"></select></div>
      <div class="row"><div><b data-t="target"></b></div><select id="target"></select></div>
      <div class="row" id="form_row"><div><b data-t="form"></b><small data-t="form_note"></small></div><select id="form"></select></div>
    </div>
    <p class="hint" data-t="easy_note"></p>
    <div class="card">
      <div class="row"><div><b data-t="scripts"></b><small data-t="scripts_note"></small></div></div>
      <div id="script_list"></div>
      <div class="row" id="script_add"><b data-t="script_add"></b>
        <span class="pick"><select id="script_pick"></select><button class="btn main" id="script_download"></button></span></div>
      <div class="bar" id="script_bar"><i></i></div>
      <div class="status" id="script_status"></div>
    </div>
    <div class="card">
      <div class="row"><div><b data-t="glossary"></b><small data-t="glossary_note"></small></div><button class="btn" id="term_add" data-t="term_add"></button></div>
      <div class="terms" id="terms"></div>
    </div>
  </section>

  <section id="model">
    <h1 data-t="nav_model"></h1>
    <div class="card">
      <div class="row"><div><b data-t="model"></b></div><div class="seg" id="families"></div></div>
      <div class="row" id="size_row"><div><b data-t="size"></b><small id="model_info"></small></div><div class="seg" id="sizes"></div></div>
      <div class="row" id="file_row"><div><b data-t="other_file"></b></div><select id="models"></select></div>
      <div class="row" id="lic_row"><div><b id="lic_name"></b><small id="lic_hint"></small></div><a id="lic_link" data-t="license_link"></a></div>
      <label class="agree" id="lic_agree_row"><input type="checkbox" id="lic_agree_model"><span data-t="lic_check"></span></label>
      <div class="bar" id="bar"><i></i></div>
      <div class="status" id="status"></div>
      <div class="actions">
        <button class="btn main" id="download"></button>
        <button class="btn danger" id="delete" data-t="delete"></button>
        <button class="btn" id="load" data-t="load"></button>
        <button class="btn" id="unload" data-t="unload"></button>
      </div>
    </div>
    <p class="hint" data-t="model_note"></p>
  </section>

  <section id="keys">
    <h1 data-t="nav_keys"></h1>
    <div class="card">
      <div class="row"><div><b data-t="key_once"></b></div><span class="keyset"><button class="key" data-key="0"></button><button class="mini" data-reset="0" data-t="key_reset"></button><button class="mini" data-off="0" data-t="key_disable"></button></span></div>
      <div class="row"><div><b data-t="key_live"></b></div><span class="keyset"><button class="key" data-key="1"></button><button class="mini" data-reset="1" data-t="key_reset"></button><button class="mini" data-off="1" data-t="key_disable"></button></span></div>
      <div class="row"><div><b data-t="key_clear"></b></div><span class="keyset"><button class="key" data-key="2"></button><button class="mini" data-reset="2" data-t="key_reset"></button><button class="mini" data-off="2" data-t="key_disable"></button></span></div>
      <div class="row"><div><b data-t="key_peek"></b><small data-t="key_peek_note"></small></div><span class="keyset"><button class="key" data-key="3"></button><button class="mini" data-reset="3" data-t="key_reset"></button><button class="mini" data-off="3" data-t="key_disable"></button></span></div>
      <div class="row"><div><b data-t="key_copy"></b></div><span class="keyset"><button class="key" data-key="4"></button><button class="mini" data-reset="4" data-t="key_reset"></button><button class="mini" data-off="4" data-t="key_disable"></button></span></div>
    </div>
    <p class="hint" data-t="key_note"></p>
    <button class="btn" id="keys_reset" data-t="keys_reset"></button>
  </section>

  <section id="look">
    <h1 data-t="nav_look"></h1>
    <div class="card">
      <div class="row"><div><b data-t="show_frame"></b><small data-t="show_frame_note"></small></div><label class="switch"><input type="checkbox" id="show_frame"><i></i></label></div>
      <div class="row"><div><b data-t="flash_frame"></b></div><label class="switch"><input type="checkbox" id="flash_frame"><i></i></label></div>
    </div>
    <div class="card">
      <div class="row"><div><b data-t="shared"></b><small data-t="shared_note"></small></div><label class="switch"><input type="checkbox" id="shared"><i></i></label></div>
    </div>
    <div class="card">
      <div class="row"><div><b data-t="font"></b></div><select id="font"></select></div>
      <div class="row"><div><b data-t="bold_text"></b><small data-t="bold_note"></small></div><label class="switch"><input type="checkbox" id="bold_text"><i></i></label></div>
      <div class="row"><div><b data-t="blur_background"></b></div><label class="switch"><input type="checkbox" id="blur_background"><i></i></label></div>
      <div class="row"><div><b data-t="opacity"></b><small data-t="opacity_note"></small></div><select id="opacity"></select></div>
    </div>
  </section>

  <section id="history">
    <h1 data-t="nav_history"></h1>
    <div class="card">
      <div class="row"><div><b data-t="keep_history"></b><small data-t="keep_note"></small></div><label class="switch"><input type="checkbox" id="keep_history"><i></i></label></div>
    </div>
    <div class="toolbar"><input type="search" id="history_find"><button class="btn" id="history_clear" data-t="clear"></button></div>
    <div class="card" id="history_list"></div>
    <p class="hint" data-t="history_note"></p>
  </section>

  <section id="run">
    <h1 data-t="nav_run"></h1>
    <div class="card">
      <div class="row"><div><b data-t="device"></b></div><select id="device"></select></div>
      <div class="row"><div><b data-t="gpu_limit"></b></div><select id="gpu_limit"></select></div>
      <div class="row"><div><b data-t="threads"></b></div><select id="threads"></select></div>
    </div>
    <div class="card">
      <div class="row"><div><b data-t="autostart"></b><small data-t="autostart_note"></small></div><label class="switch"><input type="checkbox" id="autostart"><i></i></label></div>
      <div class="row"><div><b data-t="ui_lang"></b></div><select id="ui_lang"><option value="ja">日本語</option><option value="en">English</option></select></div>
    </div>
  </section>

  <section id="about">
    <h1 data-t="nav_about"></h1>
    <div class="card">
      <div class="row"><div><b>Sonoba</b><small id="version"></small><small data-t="app_license"></small></div></div>
      <div class="row"><div><b>Built with PLaMo</b><small data-t="license_note"></small></div><a id="license" data-t="license_link"></a></div>
      <div class="row"><div><b>Hy-MT2</b><small data-t="apache_about"></small></div><a id="apache_license" data-t="license_link"></a></div>
      <div class="row"><div><b data-t="fam_other"></b><small data-t="lic_unknown"></small></div></div>
      <div class="row"><div><b data-t="folder"></b><small id="folder" style="user-select:text;word-break:break-all"></small></div></div>
    </div>
  </section>
</main>

<div id="intro">
  <div class="panel">
    <div class="step" data-step="0">
      <h1 data-t="hello"></h1>
      <p data-t="hello_note"></p>
      <button class="choice" data-lang="ja"><span>日本語</span></button>
      <button class="choice" data-lang="en"><span>English</span></button>
      <div class="foot"><span class="steps">1 / 4</span><button class="btn main" data-next data-t="next"></button></div>
    </div>
    <div class="step" data-step="1">
      <h1 data-t="pick_model"></h1>
      <p data-t="pick_model_note"></p>
      <div id="intro_families"></div>
      <div class="seg" id="intro_sizes"></div>
      <p class="hint" id="intro_info" style="margin:8px 2px 0"></p>
      <p class="hint" style="margin:10px 2px 0"><span data-t="more_models"></span> <span data-t="other_gguf"></span></p>
      <div class="foot"><span class="steps">2 / 4</span>
        <span><button class="btn" data-back data-t="prev"></button> <button class="btn" data-skip data-t="later"></button> <button class="btn main" data-next data-t="next"></button></span></div>
    </div>
    <div class="step" data-step="2">
      <h1 id="lic_head"></h1>
      <div id="lic_plamo">
        <p data-t="lic_note"></p>
        <ul class="points">
          <li data-t="lic_personal"></li>
          <li data-t="lic_business"></li>
          <li data-t="lic_publish"></li>
          <li data-t="lic_decide"></li>
          <li data-t="lic_age"></li>
        </ul>
        <p><a id="lic_open" data-t="lic_read"></a></p>
        <label class="agree"><input type="checkbox" id="lic_agree"><span data-t="lic_check"></span></label>
      </div>
      <p id="lic_other"></p>
      <p><a id="lic_open2" data-t="license_link"></a></p>
      <div class="bar" id="intro_bar"><i></i></div>
      <p id="intro_status" style="margin:6px 2px 0"></p>
      <div class="foot"><span class="steps">3 / 4</span>
        <span><button class="btn" data-back data-t="prev"></button> <button class="btn main" id="intro_download"></button></span></div>
    </div>
    <div class="step" data-step="3">
      <h1 data-t="how"></h1>
      <p data-t="how_note"></p>
      <div class="keys">
        <kbd id="how0"></kbd><span data-t="how_once"></span>
        <kbd id="how1"></kbd><span data-t="how_live"></span>
        <kbd id="how2"></kbd><span data-t="how_clear"></span>
      </div>
      <p data-t="how_bar"></p>
      <p data-t="how_share"></p>
      <div class="foot"><span class="steps">4 / 4</span>
        <span><button class="btn" data-back data-t="prev"></button> <button class="btn main" id="intro_done" data-t="start"></button></span></div>
    </div>
  </div>
</div>

<dialog id="ask">
  <h2 id="ask_title"></h2>
  <p id="ask_text" style="white-space:pre-line"></p>
  <div class="actions"><button class="btn" id="ask_no"></button><button class="btn main" id="ask_yes"></button></div>
</dialog>

<script>
const TEXT = {
  ja: {
    nav_translate: '翻訳', nav_model: 'モデル', nav_keys: 'ホットキー', nav_look: '表示', nav_run: '動作', nav_about: '情報',
    source: '翻訳元', source_note: '読み取る文字の種類です', target: '翻訳先',
    src_auto: '自動（翻訳先の言語には触らない）', src_ja: '日本語も翻訳する',
    scripts: '読み取る言語', scripts_note: '英語、フランス語、中国語、日本語などは最初から読めます。ほかの文字の言語は、ここで入れると読み取って自動で翻訳します',
    script_add: '言語を追加', sc_on: '入っています',
    sc_korean: '韓国語', sc_cyrillic: 'ロシア語、ウクライナ語など（キリル文字）', sc_arabic: 'アラビア語、ペルシャ語など', sc_th: 'タイ語',
    sc_devanagari: 'ヒンディー語など（デーヴァナーガリー）', sc_ta: 'タミル語', sc_te: 'テルグ語',
    tgt_ja: '日本語', tgt_easy: 'やさしい日本語', tgt_en: '英語', tgt_ko: '韓国語', tgt_hans: '中国語（簡体字）', tgt_hant: '中国語（繁体字）',
    easy_note: '翻訳先を「やさしい日本語」にすると、外国語をやさしい日本語に訳します。画面の日本語もやさしくしたいときは、翻訳元を「日本語も翻訳する」にします。範囲を選ぶときの上のバーでも切り替えられます。',
    model: '翻訳モデル', download: 'ダウンロード', cancel: '中止', delete: '削除', load: '読み込む', unload: 'アンロード',
    st_verify: 'ダウンロードしたファイルを確認しています', st_down: 'ダウンロード中', st_part: '途中までダウンロードしてあります（続きから再開できます）',

function renderScripts(s, downloading, packDown) {

  const list = $('script_list');
  const drawn = JSON.stringify([s.ui_lang, kept, packDown]);
  if (list.dataset.drawn !== drawn) {
    list.dataset.drawn = drawn;
    list.replaceChildren(...kept.map(x => {
      const row = document.createElement('div'), info = document.createElement('div');
      const name = document.createElement('b'), note = document.createElement('small'), drop = document.createElement('button');
      row.className = 'row';
      name.textContent = T('sc_' + x.id);
      note.textContent = T(x.present ? 'sc_on' : 'st_part');
      drop.className = 'btn';
      drop.textContent = T('delete');
      drop.disabled = packDown;
      drop.onclick = () => send('script_delete', x.id);
      info.append(name, note);
      row.append(info, drop);

  options(pick, left.map(x => [x.id, T('sc_' + x.id) + ' (' + (x.id === 'korean' ? 13 : 8) + ' MB)']), left.some(x => x.id === was) ? was : left[0]?.id ?? '');

function options(select, list, value) {
  const wanted = list.map(o => o[0] + '\u0000' + o[1]).join('\u0001');
  if (select.dataset.list !== wanted) {
    select.textContent = '';
    for (const [v, label] of list) { const o = new Option(label, v); select.add(o); }

  options($('models'), s.models.filter(m => !m.family).map(m => [m.file, m.file]), s.model);
  options($('device'), [['auto', T('dev_auto')], ['gpu', T('dev_gpu')], ['cpu', T('dev_cpu')]], s.device);
  options($('gpu_limit'), GPU_LIMITS.map(v => [v ?? '', v === null ? T('no_limit') : (v / 1024) + ' GB']), s.gpu_limit ?? '');
  const threads = [['', T('auto') + ' (' + s.cpu_auto + ')']];
  for (let n = 1; n <= s.cpu_max; n++) threads.push([n, String(n)]);
  options($('threads'), threads, s.threads ?? '');
  options($('form'), [['', T('form_auto')], ['polite', T('form_polite')], ['plain', T('form_plain')]], s.form);
  $('form_row').hidden = s.target !== 'ja';
  $('form_row').style.display = s.target === 'ja' ? '' : 'none';
  options($('font'), [['', T('font_default')], ...s.fonts.map(f => [f, f])], s.font);
  options($('opacity'), [100, 90, 80, 70, 60, 50].map(v => [v, v + '%']), s.opacity);
  renderTerms(s);
  $('history_find').placeholder = T('find');
  if (page === 'history') renderHistory();
  $('gpu_limit').disabled = s.device !== 'auto';
  $('ui_lang').value = s.ui_lang;
  for (const id of ['show_frame', 'flash_frame', 'shared', 'autostart', 'bold_text', 'blur_background', 'keep_history']) $(id).checked = s[id];
  for (const b of document.querySelectorAll('[data-key]')) {
    const i = +b.dataset.key;
    b.classList.toggle('wait', i === waiting);
    b.textContent = i === waiting ? T('key_wait') : hotkey(s.hotkeys[i]);
    b.title = s.taken.includes(i) ? T('key_taken') : '';
    b.classList.toggle('taken', s.taken.includes(i));
    b.classList.toggle('off', !s.hotkeys[i].key);
    const same = (a, c) => a.mods === c.mods && a.key === c.key;
    document.querySelector(`[data-reset="${i}"]`).disabled = same(s.hotkeys[i], s.default_hotkeys[i]);
    document.querySelector(`[data-off="${i}"]`).disabled = !s.hotkeys[i].key;
  }
  const m = s.models.find(x => x.file === s.model) ?? {};
  const downloading = s.progress >= 0;
  const packDown = downloading && s.scripts.some(x => s.downloading.startsWith(x.id + '_'));
  $('status').textContent = packDown ? T(m.present ? 'st_idle' : 'st_none') : statusOf(s);
  bar($('bar'), packDown ? { progress: -1 } : s);
  renderScripts(s, downloading, packDown);
  $('download').textContent = T(downloading ? 'cancel' : 'download');
  $('download').disabled = packDown || !((downloading && s.progress !== 100) || (!downloading && !m.present && m.download && !needsLicense(s, m)));
  renderPicker(s, $('families'), $('sizes'), $('model_info'), false);
  $('size_row').hidden = !m.family;
  $('file_row').hidden = !!m.family || !s.models.some(x => !x.family);
  $('lic_name').textContent = T(m.license === 'plamo' ? 'lic_plamo' : m.license === 'apache' ? 'lic_apache' : 'lic_other');
  $('lic_hint').textContent = licenseHint(s, m);
  $('lic_link').hidden = !licenseUrl(s, m);
  $('lic_agree_row').hidden = !needsLicense(s, m);
  $('delete').disabled = !((m.present || m.partial) && !downloading);
  $('load').disabled = !(m.present && !downloading && s.engine === 'unloaded');
  $('unload').disabled = s.engine === 'unloaded';
  $('message').hidden = !s.message;
  $('message').textContent = s.message;
  $('version').textContent = s.version;
  $('folder').textContent = s.folder;
  if (!introOpen && s.intro) {
    introOpen = true; $('intro').classList.add('on');
    if (s.intro_done) step = 2; // opened only to ask for the PLaMo license
  }
  renderIntro(s, m, downloading);
}
let terms = null, past = [];
function renderTerms(s) {
  if (terms === null) terms = s.glossary.map(t => [...t]);
  const box = $('terms');
  if (document.activeElement?.closest('#terms') && box.children.length === terms.length) return;
  box.textContent = '';
  terms.forEach((term, i) => {
    const row = document.createElement('div');
    row.className = 'term';
    const field = (index, hint) => {
      const input = document.createElement('input');
      input.type = 'text'; input.value = term[index]; input.placeholder = T(hint);
      input.onchange = () => { terms[i][index] = input.value; send('glossary', terms); };
      return input;
    };
    const gone = document.createElement('button');
    gone.className = 'x'; gone.textContent = '×'; gone.setAttribute('aria-label', T('delete'));
    gone.onclick = () => { terms.splice(i, 1); send('glossary', terms); renderTerms(state); };
    const arrow = document.createElement('span');
    arrow.textContent = '→';
    row.append(field(0, 'term_from'), arrow, field(1, 'term_to'), gone);
    box.append(row);
  });
}
const found = ([a, b]) => (a + b).toLowerCase().includes($('history_find').value.toLowerCase());
function pastRow([source, translation]) {
  const e = document.createElement('div');
  e.className = 'past';
  const small = document.createElement('small');
  small.textContent = source;
  e.append(translation, small);
  e.onclick = () => { send('copy', translation); e.firstChild.textContent = T('copied'); setTimeout(renderHistory, 700); };
  return e;
}
function renderHistory() {
  const box = $('history_list'), shown = past.filter(found);
  box.textContent = '';
  if (!shown.length) { const e = document.createElement('div'); e.className = 'past'; e.textContent = T('history_empty'); box.append(e); }
  for (const entry of shown) box.append(pastRow(entry));
}
// New translations go on top while the page is open; someone reading further down stays where they are.
function addHistory(entries) {
  const had = past.some(found);
  past = entries.concat(past).slice(0, 300); // as many as the app keeps
  if (page !== 'history') return;
  if (!had) return renderHistory();
  const box = $('history_list'), main = document.querySelector('main'), height = main.scrollHeight;
  for (const entry of entries.filter(found).reverse()) box.prepend(pastRow(entry));
  while (box.children.length > 300) box.lastChild.remove();
  if (main.scrollTop > 0) main.scrollTop += main.scrollHeight - height;
}
function renderIntro(s, m, downloading) {
  if (!introOpen) return;
  for (const el of document.querySelectorAll('.step')) el.classList.toggle('on', +el.dataset.step === step);
  for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', b.dataset.lang === s.ui_lang);
  renderPicker(s, $('intro_families'), $('intro_sizes'), $('intro_info'), true);
  const needs = needsLicense(s, m);
  $('lic_head').textContent = T(needs ? 'lic_title' : 'lic_title_plain');
  $('lic_plamo').hidden = !needs;
  $('lic_other').textContent = needs ? '' : m.license === 'apache' ? T('apache_note') : licenseHint(s, m);
  $('lic_open2').hidden = needs || !licenseUrl(s, m);
  bar($('intro_bar'), s);
  $('intro_status').textContent = m.present || downloading ? statusOf(s) : '';
  const d = $('intro_download');
  d.textContent = m.present ? T('next') : downloading ? T('cancel') : T('download');
  d.disabled = (downloading && s.progress === 100) || (needs && !$('lic_agree').checked);
  for (const i of [0, 1, 2]) $('how' + i).textContent = hotkey(s.hotkeys[i]);
}
function send(cmd, value) { post({ cmd, value }); }
function ask(title, text, yes, then) {
  $('ask_title').textContent = title; $('ask_text').textContent = text;
  $('ask_yes').textContent = yes; $('ask_no').textContent = T('back');
  pending = then; $('ask').showModal();
}
$('ask_yes').onclick = () => { $('ask').close(); pending?.(); };
$('ask_no').onclick = () => $('ask').close();
for (const b of document.querySelectorAll('nav button')) b.onclick = () => { show(b.dataset.go); if (page === 'history') send('history'); };
$('term_add').onclick = () => { terms.push(['', '']); renderTerms(state); $('terms').lastChild?.querySelector('input').focus(); };
$('history_find').oninput = renderHistory;
$('history_clear').onclick = () => { send('history_clear'); past = []; renderHistory(); };
$('opacity').onchange = e => { e.target.dataset.sent = e.target.value; send('opacity', +e.target.value); };
for (const id of ['source', 'target', 'device', 'form', 'font']) $(id).onchange = e => { e.target.dataset.sent = e.target.value; send(id, e.target.value); };
$('models').onchange = e => { e.target.dataset.sent = e.target.value; send('model', e.target.value); };
$('ui_lang').onchange = e => send('ui_lang', e.target.value);
$('gpu_limit').onchange = e => { e.target.dataset.sent = e.target.value; send('gpu_limit', e.target.value === '' ? null : +e.target.value); };
$('threads').onchange = e => { e.target.dataset.sent = e.target.value; send('threads', e.target.value === '' ? null : +e.target.value); };
for (const id of ['show_frame', 'flash_frame', 'shared', 'autostart', 'bold_text', 'blur_background', 'keep_history']) $(id).onchange = e => send(id, e.target.checked);
$('download').onclick = () => send(state.progress >= 0 ? 'cancel' : 'download');
$('delete').onclick = () => {
  const m = state.models.find(x => x.file === state.model);
  ask(T('ask_delete'), m.file + ' ' + T('ask_delete_q') + '\n' + T(m.download ? 'del_again' : 'del_gone'), T('del_yes'), () => send('delete'));
};
$('script_download').onclick = () => send(state.progress >= 0 ? 'cancel' : 'script_download', $('script_pick').value);
$('load').onclick = () => send('load');
$('unload').onclick = () => send('unload');
for (const a of [$('license'), $('lic_open')]) a.onclick = () => send('open', LICENSE[state.ui_lang] ?? LICENSE.ja);
$('apache_license').onclick = () => send('open', APACHE);
for (const a of [$('lic_link'), $('lic_open2')]) a.onclick = () => send('open', licenseUrl(state, state.models.find(x => x.file === state.model) ?? {}));
$('lic_agree_model').onchange = e => { if (e.target.checked) send('license_accept'); };
function choosing(index) {
  if (waiting >= 0 !== index >= 0) send('capture', index >= 0);
  waiting = index;
  render(state);
}
for (const b of document.querySelectorAll('[data-key]')) b.onclick = () => choosing(+b.dataset.key);
for (const b of document.querySelectorAll('[data-reset]')) b.onclick = () => send('hotkey_reset', +b.dataset.reset);
for (const b of document.querySelectorAll('[data-off]')) b.onclick = () => send('hotkey_off', +b.dataset.off);
$('keys_reset').onclick = () => send('hotkey_reset', null);
addEventListener('blur', () => { if (waiting >= 0) choosing(-1); });
addEventListener('keydown', e => {
  if (waiting < 0) return;
  e.preventDefault();
  if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return;
  const index = waiting;
  if (e.key === 'Escape') return choosing(-1);
  if (!e.ctrlKey && !e.altKey) { choosing(-1); state.message = T('key_bad'); return render(state); }
  waiting = -1;
  post({ cmd: 'hotkey', index, mods: (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.shiftKey ? 4 : 0), key: e.keyCode });
}, true);
addEventListener('keyup', e => { if (waiting >= 0) e.preventDefault(); }, true);
addEventListener('mousedown', e => {
  const key = { 1: 4, 3: 5, 4: 6 }[e.button];
  if (waiting >= 0 && e.button === 0 && !e.target.closest('[data-key]')) return choosing(-1);
  if (waiting < 0 || !key) return;
  e.preventDefault(); e.stopPropagation();
  const index = waiting;
  waiting = -1;
  post({ cmd: 'hotkey', index, mods: (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.shiftKey ? 4 : 0), key });
}, true);
for (const b of document.querySelectorAll('[data-lang]')) b.onclick = () => send('ui_lang', b.dataset.lang);
function go(n) {
  if (n !== step) trail.push(step); // Back returns to where the user came from, even after a skip
  step = n;
  renderIntro(state, state.models.find(x => x.file === state.model) ?? {}, state.progress >= 0);
}
function back() {
  const n = trail.pop() ?? Math.max(0, step - 1);
  step = n;
  renderIntro(state, state.models.find(x => x.file === state.model) ?? {}, state.progress >= 0);
}
for (const b of document.querySelectorAll('[data-back]')) b.onclick = back;
for (const b of document.querySelectorAll('[data-next]')) b.onclick = () => go(step + 1);
for (const b of document.querySelectorAll('[data-skip]')) b.onclick = () => go(3);
$('lic_agree').onchange = () => go(step);
$('intro_download').onclick = () => {
  const m = state.models.find(x => x.file === state.model) ?? {};
  if (needsLicense(state, m)) send('license_accept'); // the button only works with the box ticked
  if (m.present) {
    if (!state.intro_done) return go(3);
    introOpen = false; $('intro').classList.remove('on');
    return;
  }
  send(state.progress >= 0 ? 'cancel' : 'download');
};
$('intro_done').onclick = () => { introOpen = false; $('intro').classList.remove('on'); send('intro_done'); };
chrome.webview.addEventListener('message', e => {
  if (e.data.go) { show(e.data.go); if (page === 'history') send('history'); }
  else if (e.data.history_new) addHistory(e.data.history_new);
  else if (e.data.history) { past = e.data.history; renderHistory(); } else render(e.data);
});
show(page);
post({ cmd: 'ready' });
</script>
